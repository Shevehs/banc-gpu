# Prometheus of the Docker Compose with the LiteLLM gateway (README, section 4.4): vLLM and LiteLLM.
# The LiteLLM key goes in docker/secrets/litellm.key (readable by every account: use a limited virtual key if you can).
global:
  scrape_interval: 15s

scrape_configs:
  - job_name: vllm
    static_configs:
      - targets: ["host.docker.internal:8000"]
  - job_name: litellm
    metrics_path: /metrics/
    authorization:
      credentials_file: /etc/prometheus/secrets/litellm.key
    static_configs:
      - targets: ["litellm:4000"]
