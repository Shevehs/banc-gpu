# The client side of the bench in Docker (README, section 4.4).
#   docker compose up -d --build                     the interface and Prometheus (vLLM only)
#   COMPOSE_PROFILES=gateway docker compose up -d    + LiteLLM, in front of your vLLM
#   COMPOSE_PROFILES=try docker compose up -d        + a fake server, to try everything without a GPU
# Choices (profile, Prometheus configuration, ports, key) go in a .env file: see .env.example.
# vLLM is not part of it: it runs on your GPU server, and the bench reaches it by its address
# (host.docker.internal for a vLLM on the machine that runs Docker).
name: banc-gpu

x-bench: &bench
  build: {context: docker}
  image: banc-gpu-bench
  working_dir: /app
  user: "${BENCH_UID:-0}:${BENCH_GID:-0}"          # your own user (id -u, id -g) keeps the results yours on Linux
  volumes: [".:/app"]                               # results, traces, tokenizer, target.env stay in your folder
  security_opt: ["no-new-privileges:true"]
  extra_hosts: ["host.docker.internal:host-gateway"]

services:
  bench:
    <<: *bench
    entrypoint: ["bash", "docker/entrypoint.sh"]         # downloads the tokenizer once if BENCH_TOKENIZER_REPO is set
    command: ["python", "-m", "interface.server", "--host", "0.0.0.0", "--port", "8765", "--public-port", "${BENCH_PORT:-8765}"]
    ports: ["127.0.0.1:${BENCH_PORT:-8765}:8765"]   # the interface is reachable from this machine only
    environment:
      BENCH_TOKEN: "${BENCH_TOKEN:-}"               # empty: a random token, shown by `docker compose logs bench`
      BENCH_PROMETHEUS: "http://prometheus:9090"
      BENCH_LITELLM_SELECTOR: "${BENCH_LITELLM_SELECTOR:-}"
      BENCH_ALLOW_PUBLIC_URLS: "${BENCH_ALLOW_PUBLIC_URLS:-}"     # 1: accept a target on a public address
      BENCH_TOKENIZER_REPO: "${BENCH_TOKENIZER_REPO:-}"           # Hugging Face name of the model: its tokenizer is downloaded once
      HF_TOKEN: "${HF_TOKEN:-}"                                    # only for a gated model; not passed on to the runs
    depends_on: [prometheus]

  prometheus:
    image: prom/prometheus:v3.7.3
    ports: ["127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"]      # Prometheus asks for no key: do not open it to the network
    volumes:
      - ./docker/${PROMETHEUS_CONFIG:-prometheus.yml}:/etc/prometheus/prometheus.yml:ro
      - ./docker/secrets:/etc/prometheus/secrets:ro
      - prometheus-data:/prometheus
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.retention.time=30d"]
    extra_hosts: ["host.docker.internal:host-gateway"]
    restart: unless-stopped

  litellm:
    profiles: [gateway]
    image: "ghcr.io/berriai/litellm:${LITELLM_TAG:-main-stable}"
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    ports: ["127.0.0.1:${LITELLM_PORT:-4000}:4000"]
    volumes: ["./docker/litellm-config.yaml:/app/config.yaml:ro"]
    environment:
      LITELLM_MASTER_KEY: "${LITELLM_MASTER_KEY:-}"     # empty: LiteLLM refuses to start (it never runs open)
      DATABASE_URL: "postgresql://litellm:${LITELLM_DB_PASSWORD:-}@litellm-db:5432/litellm"
      VLLM_API_BASE: "${VLLM_API_BASE:-http://host.docker.internal:8000/v1}"
      VLLM_API_KEY: "${VLLM_API_KEY:-none}"
    extra_hosts: ["host.docker.internal:host-gateway"]
    depends_on:
      litellm-db: {condition: service_healthy}
    restart: unless-stopped

  litellm-db:                                        # LiteLLM's database: virtual keys (one per agent), spend logs
    profiles: [gateway]
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: litellm
      POSTGRES_PASSWORD: "${LITELLM_DB_PASSWORD:-}"      # empty: PostgreSQL refuses to start. No port is published.
      POSTGRES_DB: litellm
    volumes: ["litellm-db-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U litellm -d litellm"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  fake-server:
    <<: *bench
    profiles: [try]
    command: ["python", "tools/fake_server.py", "--host", "0.0.0.0", "--port", "8001"]

volumes:
  prometheus-data:
  litellm-db-data:
